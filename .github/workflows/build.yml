name: Build Apple login fix IPA

on:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Publish compiled IPA
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record toolchain and fix revision
        run: |
          xcodebuild -version
          git rev-parse HEAD
          git merge-base --is-ancestor 6794cfca8b6fc61eab72961d5c67b7613523ac3e HEAD
      - name: Archive unsigned ARM64 iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive -project GetMoreRam.xcodeproj -scheme GetMoreRam \
            -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/GetMoreRam.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" | tee build/build.log
      - name: Package IPA and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/GetMoreRam.xcarchive/Products/Applications/GetMoreRam.app build/Payload/
          lipo build/Payload/GetMoreRam.app/GetMoreRam -verify_arch arm64
          plutil -lint build/Payload/GetMoreRam.app/Info.plist
          cd build
          ditto -c -k --keepParent Payload GetMoreRam-apple-login-fix-unsigned.ipa
          shasum -a 256 GetMoreRam-apple-login-fix-unsigned.ipa > SHA256SUMS.txt
          printf 'source=%s\nupstream_fix=%s\n' "$(git rev-parse HEAD)" \
            6794cfca8b6fc61eab72961d5c67b7613523ac3e > provenance.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GetMoreRam-apple-login-fix
          path: |
            build/*.ipa
            build/SHA256SUMS.txt
            build/provenance.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
      - name: Publish downloadable build
        if: inputs.release__nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apple-login-fix-${{ github.run_id }}" \
            --target "${{ github.sha }}" --prerelease \
            --title "GetMoreRam Apple login fix" \
            --notes "Unsigned iOS IPA based on upstream PR #48 (6794cfc). Personal signing required. Build only; Apple sign-in and increased-memory permission require device verification. No Apple credentials are used in CI." \
            build/GetMoreRam-apple-login-fix-unsigned.ipa build/SHA256SUMS.txt build/provenance.txt \
            --repo "${{ github.repository }}"
